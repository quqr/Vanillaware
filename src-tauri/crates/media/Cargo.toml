[package]
name = "media"
version = "0.1.0"
edition = "2021"
description = "Image, audio and video codecs plus thumbnail cache and PNG encoding."
publish = false

[dependencies]
formats = { path = "../formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
cridecoder = "0.3"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "audio_probe"
path = "tests/tools/audio_probe.rs"

[[example]]
name = "content_probe"
path = "tests/tools/content_probe.rs"

[[example]]
name = "usm_probe"
path = "tests/tools/usm_probe.rs"

[[example]]
name = "usm_dump"
path = "tests/tools/usm_dump.rs"

[[example]]
name = "usm_gop_probe"
path = "tests/tools/usm_gop_probe.rs"
