name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--no-bundle"
            artifact: "vanillaware-windows-x64.exe"
          - platform: ubuntu-22.04
            args: "--bundles appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build ${{ matrix.args }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename Windows executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp src-tauri/target/release/vanillaware.exe \
            "vanillaware-${{ steps.tag.outputs.tag }}-windows-x64.exe"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Vanillaware Asset Browser ${{ steps.tag.outputs.tag }}"
          body: "Unpack nothing: run the exe (Windows) or the AppImage (Linux) directly. The WebView2 runtime must be present on Windows (preinstalled on Windows 10 21H2+)."
          files: |
            vanillaware-*-windows-x64.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
